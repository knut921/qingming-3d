<body>
  <main class="experience">
    <header class="masthead">
      <div class="identity"><span class="seal" aria-hidden="true">入<br>畫</span><div><h1>虹橋<span>・</span>入畫</h1><p>清明上河圖意境 · 互動立體漫遊</p></div></div>
      <a class="film-link" href="./tour.mp4" target="_blank" rel="noopener"><span aria-hidden="true">▷</span> 觀看原動畫 <span class="film-length">30 秒</span></a>
    </header>

    <section id="stage" aria-label="虹橋互動三維場景" aria-describedby="interaction-help">
      <canvas id="scene" tabindex="0" aria-label="3D 場景。拖曳旋轉、滾輪縮放，右鍵拖曳平移；空白鍵播放或暫停動畫。"></canvas>
      <div id="loading" class="loading" role="status" aria-live="polite">
        <img src="./poster.png?v=20260909-visitors-1" alt="虹橋、橋上市集與河船的立體場景預覽" />
        <div class="loading-card"><span class="eyebrow">一座橋，一幅流動的畫</span><h2>正在走入虹橋</h2><div class="progress"><i id="progress-bar"></i></div><p id="load-status">載入立體場景…</p></div>
      </div>
      <div id="error" class="error-card" hidden role="alert"><h2>暫時無法顯示 3D 場景</h2><p id="error-message">請重新載入，或使用支援 WebGL 的瀏覽器。</p><button id="retry" type="button">重新載入</button><a href="./tour.mp4">觀看 30 秒動畫</a></div>

      <aside class="scene-note"><span class="eyebrow">虹橋市集</span><p>橋上人來人往，<br>橋下舟行水流。</p><span class="small-note">以原畫局部重建的微縮場景</span></aside>

      <div class="view-tools" aria-label="視角工具">
        <button id="zoom-in" class="icon-button" aria-label="放大" title="放大">＋</button>
        <button id="zoom-out" class="icon-button" aria-label="縮小" title="縮小">−</button>
        <span class="tool-separator"></span>
        <button id="reset" class="icon-button" aria-label="回到初始視角" title="回到初始視角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button>
        <button id="fullscreen" class="icon-button" aria-label="進入全螢幕" title="全螢幕"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      </div>

      <div class="bottom-area">
        <div id="interaction-help" class="interaction-help"><span class="desktop-help">拖曳旋轉 <i>·</i> 滾輪縮放 <i>·</i> 右鍵平移</span><span class="touch-help">單指旋轉 <i>·</i> 雙指縮放或平移</span></div>
        <div class="control-panel" aria-label="場景與動畫控制">
          <nav class="view-presets" aria-label="快速切換視角">
            <button data-view="overview" class="selected" aria-pressed="true">全景</button><button data-view="bridge" aria-pressed="false">橋上市集</button><button data-view="river" aria-pressed="false">河上舟行</button><button data-view="quay" aria-pressed="false">河岸人家</button>
          </nav>
          <div class="playback">
            <button id="play" class="play-button" aria-label="暫停動畫" disabled><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
            <div class="timeline"><div class="timeline-label"><span>畫中日常</span><output id="time" for="scrubber">00:00 <span>/ 00:30</span></output></div><input id="scrubber" type="range" min="0" max="30" step="0.05" value="0" aria-label="動畫時間，單位秒" disabled></div>
            <label class="speed-label"><span class="sr-only">動畫播放速度</span><select id="speed" aria-label="動畫播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label>
            <button id="orbit" class="orbit-button" aria-pressed="false" title="自動環繞視角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8c-2-4-13-4-16 1s3 10 9 10c5 0 8-3 9-6M19 3v5h-5"/></svg><span>環繞</span></button>
          </div>
        </div>
        <footer><span><b>98</b> 位人物 <i>／</i> 一場 30 秒的橋上日常</span><a href="./models/qingming.glb?v=20260909-visitors-1" download="qingming.glb">下載 3D 模型 <span aria-hidden="true">↓</span></a></footer>
      </div>
    </section>
